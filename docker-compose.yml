version: '3.8'

services:
  frontend:
    build:
      context: ./frontend    # 👈 This tells Docker to look inside your frontend folder!
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend     # 👈 This tells Docker to look inside your backend folder!
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
